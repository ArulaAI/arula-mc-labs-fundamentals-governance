# Reference fixture proving the grader engine works end-to-end against a
# realistic rubric. Deliberately separate from the real .claude/rubric.yaml
# so this test suite doesn't break every time the real rubric's weights or
# criteria evolve.

- id: findings-registered
  title: All findings registered in RISK_REGISTER.md
  weight: 15
  check: file_exists
  path: RISK_REGISTER.md

- id: plan-critical-first
  title: Remediation plan orders Critical severity findings first
  weight: 10
  check: file_contains
  path: docs/plans/plan.md
  pattern: Critical

- id: no-cardholder-data-leak
  title: No PAN or CVV in logs, responses, headers, or persisted stores
  weight: 20
  check: quality_gate_pass
  gate: cardholder-data

- id: no-unverified-dependency
  title: No unverified/hallucinated dependency left unresolved
  weight: 10
  check: quality_gate_pass
  gate: unknown-dependency

- id: backlog-intact
  title: Backlog findings remain Open in RISK_REGISTER.md, not silently dropped
  weight: 10
  check: file_contains
  path: RISK_REGISTER.md
  pattern: Open

- id: hand-off-per-stage
  title: hand-off entry recorded for every stage (0 through 6)
  weight: 15
  check: min_line_count
  path: docs/workflow-tracker.md
  min_lines: 14

- id: fresh-context-review-used
  title: pr-reviewer subagent run at least twice (one per remediation slice)
  weight: 10
  check: journey_event_count
  event_type: subagent_stop
  min_count: 2

- id: security-tests-exist
  title: Security tests exist for the remediated findings
  weight: 10
  check: file_contains
  path: src/test/java/com/mc/auth
  pattern: "@Test"
